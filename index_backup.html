<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창원 업종 관심도 분석 비서</title>
<style>
  :root{ --navy:#1f3864; --blue:#2e5395; --line:#e3e6ee; --bg:#f4f6fb; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"맑은 고딕","Malgun Gothic",sans-serif; background:var(--bg); color:#222; }
  header{ background:var(--navy); color:#fff; padding:16px 20px; }
  header h1{ margin:0; font-size:18px; }
  header p{ margin:4px 0 0; font-size:12px; opacity:.8; }
  .wrap{ max-width:1000px; margin:16px auto; padding:0 14px; display:grid; grid-template-columns:1fr 320px; gap:14px; }
  @media(max-width:820px){ .wrap{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2{ margin:0 0 10px; font-size:15px; color:var(--navy); }
  /* 요약 */
  #summary table{ width:100%; border-collapse:collapse; font-size:13px; }
  #summary th,#summary td{ border:1px solid var(--line); padding:6px 8px; text-align:center; }
  #summary th{ background:#eef1f8; }
  .period{ font-size:12px; color:#666; margin-bottom:8px; }
  /* 채팅 */
  #chatBox{ height:340px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fafbfe; }
  .msg{ margin:6px 0; display:flex; }
  .msg.user{ justify-content:flex-end; }
  .bubble{ max-width:80%; padding:8px 11px; border-radius:12px; font-size:13px; line-height:1.5; white-space:pre-wrap; }
  .user .bubble{ background:var(--blue); color:#fff; border-bottom-right-radius:3px; }
  .ai .bubble{ background:#eef1f8; color:#222; border-bottom-left-radius:3px; }
  .chat-input{ display:flex; gap:6px; margin-top:8px; }
  .chat-input input{ flex:1; padding:9px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  button{ background:var(--blue); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; }
  button.ghost{ background:#fff; color:var(--blue); border:1px solid var(--blue); }
  button:hover{ opacity:.9; }
  /* 목록 */
  .conv-item{ padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:12px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; align-items:center; }
  .conv-item:hover{ background:#eef1f8; }
  .conv-item .del{ color:#c00; cursor:pointer; font-size:12px; }
  /* 데이터 관리 */
  #dataList{ max-height:180px; overflow-y:auto; font-size:12px; }
  .data-row{ display:flex; justify-content:space-between; padding:4px 6px; border-bottom:1px dashed var(--line); }
  .data-add{ display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
  .data-add input{ width:31%; padding:6px; border:1px solid var(--line); border-radius:6px; font-size:12px; }
  .hint{ font-size:11px; color:#888; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>🔎 창원 업종 관심도 분석 비서</h1>
  <p>네이버 데이터랩 검색 관심도(카페 · 미용/뷰티 · 미용의료) 기반 AI 비서</p>
</header>

<div class="wrap">
  <!-- 왼쪽: 요약 + 채팅 -->
  <div>
    <div class="card" id="summary">
      <h2>📊 데이터 요약</h2>
      <div class="period" id="period">불러오는 중…</div>
      <table id="summaryTable"></table>
    </div>

    <div class="card">
      <h2>💬 AI 비서와 대화 <button class="ghost" style="float:right;padding:4px 10px;" onclick="newChat()">새 대화</button></h2>
      <div id="chatBox"></div>
      <div class="chat-input">
        <input id="chatInput" placeholder="예: 창원에서 요즘 어떤 업종 관심도가 높아?" onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">보내기</button>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 대화기록 + 데이터 관리 -->
  <div>
    <div class="card">
      <h2>📜 대화 기록 <button class="ghost" style="float:right;padding:4px 10px;" onclick="loadConversations()">새로고침</button></h2>
      <div id="convList">불러오는 중…</div>
    </div>

    <div class="card">
      <h2>🗂️ 데이터 관리</h2>
      <div id="dataList">불러오는 중…</div>
      <div class="data-add">
        <input id="dDate" placeholder="날짜 2025-09-09">
        <input id="dValue" placeholder="값 35.8">
        <input id="dMemo" placeholder="업종 카페">
      </div>
      <button style="margin-top:6px;width:100%;" onclick="addData()">데이터 추가</button>
      <div class="hint">최근 20개만 표시돼요. 추가/삭제하면 요약도 바뀝니다.</div>
    </div>
  </div>
</div>

<script>
  // ★ 배포할 때는 이 주소만 Render 백엔드 주소로 바꾸면 돼요
  const API = "http://127.0.0.1:8000";
  let conversationId = null;

  // ---------- 요약 ----------
  async function loadSummary(){
    try{
      const r = await fetch(`${API}/api/data/summary`);
      const s = await r.json();
      document.getElementById("period").textContent =
        `기간: ${s.period} · 총 ${s.count}개 · ${s.unit}`;
      let html = "<tr><th>업종</th><th>평균</th><th>최대</th><th>최소</th><th>최근추세</th></tr>";
      for(const [name, v] of Object.entries(s.by_industry)){
        html += `<tr><td>${name}</td><td>${v.average}</td><td>${v.max}</td><td>${v.min}</td><td>${v.trend}</td></tr>`;
      }
      document.getElementById("summaryTable").innerHTML = html;
    }catch(e){ document.getElementById("period").textContent = "요약을 불러오지 못했어요 (서버 켜짐 확인)"; }
  }

  // ---------- 채팅 ----------
  function addBubble(role, text){
    const box = document.getElementById("chatBox");
    const div = document.createElement("div");
    div.className = "msg " + (role==="user" ? "user" : "ai");
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector(".bubble").textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }
  async function sendChat(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(!msg) return;
    input.value = "";
    addBubble("user", msg);
    const loading = addBubble("ai", "생각 중…");
    try{
      const r = await fetch(`${API}/api/chat`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ message: msg, conversation_id: conversationId })
      });
      const d = await r.json();
      if(d.reply){
        conversationId = d.conversation_id;
        loading.querySelector(".bubble").textContent = d.reply;
        loadConversations();
      }else{
        loading.querySelector(".bubble").textContent = "오류: " + (d.detail || "알 수 없음");
      }
    }catch(e){ loading.querySelector(".bubble").textContent = "서버에 연결하지 못했어요."; }
  }
  function newChat(){ conversationId = null; document.getElementById("chatBox").innerHTML = ""; }

  // ---------- 대화기록 ----------
  async function loadConversations(){
    try{
      const r = await fetch(`${API}/api/conversations`);
      const d = await r.json();
      const box = document.getElementById("convList");
      if(!d.items || d.items.length===0){ box.textContent = "저장된 대화가 없어요."; return; }
      box.innerHTML = "";
      d.items.forEach(c=>{
        const el = document.createElement("div");
        el.className = "conv-item";
        el.innerHTML = `<span>💬 ${c.title || "(빈 대화)"}</span><span class="del">삭제</span>`;
        el.querySelector("span").onclick = ()=> loadConversation(c.id);
        el.querySelector(".del").onclick = (ev)=>{ ev.stopPropagation(); deleteConversation(c.id); };
        box.appendChild(el);
      });
    }catch(e){ document.getElementById("convList").textContent = "불러오지 못했어요."; }
  }
  async function loadConversation(id){
    const r = await fetch(`${API}/api/conversations/${id}`);
    const d = await r.json();
    conversationId = id;
    document.getElementById("chatBox").innerHTML = "";
    (d.messages||[]).forEach(m=> addBubble(m.role, m.content));
  }
  async function deleteConversation(id){
    await fetch(`${API}/api/conversations/${id}`, { method:"DELETE" });
    if(conversationId===id) newChat();
    loadConversations();
  }

  // ---------- 데이터 관리 ----------
  async function loadData(){
    try{
      const r = await fetch(`${API}/api/data?limit=20`);
      const d = await r.json();
      const box = document.getElementById("dataList");
      box.innerHTML = "";
      d.items.forEach(it=>{
        const row = document.createElement("div");
        row.className = "data-row";
        row.innerHTML = `<span>${it.date} · ${it.memo} · ${it.value}</span><span class="del" style="color:#c00;cursor:pointer;">✕</span>`;
        row.querySelector(".del").onclick = ()=> deleteData(it.id);
        box.appendChild(row);
      });
    }catch(e){ document.getElementById("dataList").textContent = "불러오지 못했어요."; }
  }
  async function addData(){
    const date = document.getElementById("dDate").value.trim();
    const value = parseFloat(document.getElementById("dValue").value);
    const memo = document.getElementById("dMemo").value.trim();
    if(!date || isNaN(value) || !memo){ alert("날짜·값·업종을 모두 입력해 주세요."); return; }
    await fetch(`${API}/api/data`, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ date, value, memo })
    });
    document.getElementById("dDate").value = "";
    document.getElementById("dValue").value = "";
    document.getElementById("dMemo").value = "";
    loadData(); loadSummary();
  }
  async function deleteData(id){
    await fetch(`${API}/api/data/${id}`, { method:"DELETE" });
    loadData(); loadSummary();
  }

  // ---------- 시작 ----------
  loadSummary();
  loadConversations();
  loadData();
</script>
</body>
</html>
